[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "breakout-runner"
version = "0.1.0"
description = "Deterministic Breakout-with-Volume (Deodhar, weekly) runner for the Supabase paper tracker"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.6,<3",
    "httpx>=0.27,<1",
    "psycopg[binary]>=3.1,<4",
    "PyYAML>=6,<7",
    "python-dotenv>=1.0,<2",
    "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
breakout-runner = "breakout_runner.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
